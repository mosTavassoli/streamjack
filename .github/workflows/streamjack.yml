name: streamjack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  STREAMJACK_JAR: streamjack-kafka/target/streamjack-kafka-0.3.0-SNAPSHOT-all.jar
  REPORT_PATH: streamjack-report/streamjack-report.json

jobs:
  scenarios:
    name: scenarios (hardened sample agent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report-id: ${{ steps.report.outputs.artifact-id }}
    services:
      kafka:
        image: apache/kafka:4.1.1
        ports:
          - 127.0.0.1:9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=5s
          --health-timeout=8s
          --health-retries=12
          --health-start-period=10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build runner and sample agent
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Start hardened sample agent
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          STREAMJACK_AGENT_MODEL: SCRIPTED
          STREAMJACK_AGENT_SECURITY_MODE: HARDENED
        run: |
          nohup java -jar sample-agent/target/quarkus-app/quarkus-run.jar > sample-agent.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 --output /dev/null http://localhost:8080/q/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "The sample agent did not become ready." >&2
          cat sample-agent.log >&2
          exit 1
      - name: Run scenarios
        id: run
        run: |
          report="$RUNNER_TEMP/$REPORT_PATH"
          status=0
          java -jar "$STREAMJACK_JAR" --agent sample-agent-hardened --scenarios scenarios --report "$report" || status=$?
          if [[ "$status" -gt 2 || ! -s "$report" ]]; then
            echo "streamjack did not produce a report (exit $status)." >&2
            exit 1
          fi
      - name: Write summary and enforce security gate
        run: >-
          java -jar "$STREAMJACK_JAR" github-check
          --report "$RUNNER_TEMP/$REPORT_PATH" --no-publish --enforce
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        id: report
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamjack-report.json
          path: ${{ runner.temp }}/${{ env.REPORT_PATH }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    # Do not give fork or Dependabot runs a write token. The read-only job still produces a summary.
    if: >-
      ${{ !cancelled() && needs.scenarios.outputs.report-id != '' && github.actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the PR base's publisher, never the PR head's build or binaries in this job.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Check for publisher on the base ref
        id: publisher
        run: |
          if [[ -f streamjack-kafka/src/main/java/io/github/mostavassoli/streamjack/kafka/cli/GitHubCheckCommand.java ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "The GitHub Checks publisher is not yet on the base ref; see the scenario job summary."
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.publisher.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build publisher
        if: steps.publisher.outputs.available == 'true'
        run: mvn --batch-mode --no-transfer-progress -pl streamjack-kafka -am -DskipTests package
      - name: Download report
        if: steps.publisher.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scenarios.outputs.report-id }}
          skip-decompress: true
          path: ${{ runner.temp }}/streamjack-report
      - name: Publish streamjack check
        if: steps.publisher.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP/streamjack-report/"*)
          if (( ${#files[@]} != 1 )) || [[ ! -f "${files[0]}" || -L "${files[0]}" ]]; then
            echo "Expected one regular file from the report artifact." >&2
            exit 1
          fi
          java -jar "$STREAMJACK_JAR" github-check --report "${files[0]}" --head-sha "$HEAD_SHA"
