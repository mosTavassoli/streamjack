quarkus.application.name=streamjack-sample-agent

# A packaged agent expects an external broker. Dev mode uses Quarkus Dev Services;
# tests inject a disposable Testcontainers broker.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%dev.quarkus.kafka.devservices.port=9092
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.http.test-port=0

mp.messaging.incoming.tickets.connector=smallrye-kafka
mp.messaging.incoming.tickets.topic=support.tickets
mp.messaging.incoming.tickets.group.id=streamjack-sample-agent
mp.messaging.incoming.tickets.auto.offset.reset=earliest
mp.messaging.incoming.tickets.enable.auto.commit=false
mp.messaging.incoming.tickets.commit-strategy=throttled
mp.messaging.incoming.tickets.failure-strategy=dead-letter-queue
mp.messaging.incoming.tickets.dead-letter-queue.topic=support.tickets.dlq
mp.messaging.incoming.tickets.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.tickets.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.triage-results.connector=smallrye-kafka
mp.messaging.outgoing.triage-results.topic=support.triage
mp.messaging.outgoing.triage-results.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.triage-results.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.audit-events.connector=smallrye-kafka
mp.messaging.outgoing.audit-events.topic=streamjack.audit
mp.messaging.outgoing.audit-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.audit-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.published-replies.connector=smallrye-kafka
mp.messaging.outgoing.published-replies.topic=support.published
mp.messaging.outgoing.published-replies.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.published-replies.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Deterministic by default; switch both settings explicitly for controlled experiments.
streamjack.agent.model=${STREAMJACK_AGENT_MODEL:SCRIPTED}
streamjack.agent.security-mode=${STREAMJACK_AGENT_SECURITY_MODE:HARDENED}

# Optional real-model profile. Request/response logging stays off because prompts are untrusted.
quarkus.langchain4j.devservices.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:qwen3:1.7b}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.chat-model.model-options.return-thinking=false
quarkus.langchain4j.timeout=60s
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
